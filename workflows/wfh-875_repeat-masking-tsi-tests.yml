# Test for WorkflowHub 875 "Repeat masking - TSI", Version 3 (version ID 3, 21 Jun 2024).
# Workflow file: wfh-875_repeat-masking-tsi.ga, copied from gtntesting workflow 28153e5ae815e24c on 15 Oct 2026.
# Test runs on: usegalaxy.org.au, account gtntesting (API key in the GitHub secret GALAXY_API_KEY).
# Test data: history "workflow-testing: small test data" (ee825ba6ed112e3a) in gtntesting.
#   The dataset URLs below are readable by anyone with the link (checked 15 Oct 2026). The history itself is not published.
#   If the datasets are deleted or purged, this test fails. A Zenodo copy would be more durable.
# Pass rule: all jobs finish without error, and every output exists and is not empty.
# To check on the first run: RepeatModeler can find no repeat families in a 2.4 MB genome. If so, use a larger subset.
- doc: Find and mask repeats in 2.4 MB of the Mucor mucedo genome.
  job:
    "genome.fasta":
      class: File
      location: https://usegalaxy.org.au/api/datasets/a6e389a98c2d16783289fc7ee3e95be2/display?to_ext=fasta
      filetype: fasta         # Mucor_mucedo_genome_first30000lines.fasta, 2.4 MB
  outputs:
    seeds: {asserts: {has_size: {min: 1}}}
    sequences: {asserts: {has_size: {min: 1}}}
    output_log: {asserts: {has_size: {min: 1}}}
    Repeats_output_table: {asserts: {has_size: {min: 1}}}
    output_repeat_catalog: {asserts: {has_size: {min: 1}}}
    output_masked_genome:                            # masked genome (FASTA)
      asserts:
        has_text: {text: ">"}
