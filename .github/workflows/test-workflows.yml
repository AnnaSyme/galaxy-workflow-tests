name: Test workflows

# Runs by hand only (workflow_dispatch) until Galaxy Australia agrees to scheduled runs.
# Each workflow runs on usegalaxy.org.au in the gtntesting account. Planemo checks the outputs.
# A maximum of 2 workflows run at a time, to keep the load on Galaxy Australia low.

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow file to test, or all"
        required: true
        default: all
        type: choice
        options:
          - all
          - ga-annasyme_qc-of-illumina-data
          - ga-annasyme_what-is-in-my-reads
          - wfh-875_repeat-masking-tsi

env:
  GALAXY_URL: https://usegalaxy.org.au
  PLANEMO_VERSION: 0.75.35

jobs:
  list:
    name: List workflows to test
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.pick.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick workflows
        id: pick
        run: |
          if [ "${{ inputs.workflow }}" = "all" ]; then
            list=$(ls workflows/*.ga | xargs -n1 basename | sed 's/\.ga$//' | jq -R . | jq -sc .)
          else
            list=$(printf '%s' '${{ inputs.workflow }}' | jq -R . | jq -sc .)
          fi
          echo "workflows=$list" >> "$GITHUB_OUTPUT"
          echo "Testing: $list"

  test:
    name: ${{ matrix.workflow }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        workflow: ${{ fromJson(needs.list.outputs.workflows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Planemo
        run: pip install "planemo==${{ env.PLANEMO_VERSION }}"

      - name: Run Planemo test
        run: |
          planemo test \
            --engine external_galaxy \
            --galaxy_url "$GALAXY_URL" \
            --galaxy_user_key "${{ secrets.GALAXY_API_KEY }}" \
            --history_name "github-test: ${{ matrix.workflow }} (run ${{ github.run_number }})" \
            --test_timeout 10800 \
            --test_output "reports/${{ matrix.workflow }}.html" \
            --test_output_json "reports/${{ matrix.workflow }}.json" \
            --test_output_text "reports/${{ matrix.workflow }}.txt" \
            "workflows/${{ matrix.workflow }}.ga"

      - name: Show text report
        if: always()
        run: cat "reports/${{ matrix.workflow }}.txt" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.workflow }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
