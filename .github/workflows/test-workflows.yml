name: Test workflows

# Runs by hand only (workflow_dispatch) until Galaxy Australia agrees to scheduled runs.
# Each workflow is downloaded from its public source (workflows.yml), then run with Planemo
# on usegalaxy.org.au in the gtntesting account. A maximum of 2 workflows run at a time.

on:
  workflow_dispatch:
    inputs:
      workflows:
        description: "Names from workflows.yml, comma separated, or all"
        required: true
        default: all
      verbose:
        description: "Verbose Planemo log, to find where a run stops"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  list:
    name: List workflows
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: List
        id: list
        env:
          SELECTION: ${{ inputs.workflows }}
        run: |
          names=$(python scripts/workflows.py list "$SELECTION")
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Testing: $names"

  test:
    name: ${{ matrix.name }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        name: ${{ fromJson(needs.list.outputs.names) }}
    env:
      GALAXY_URL: https://usegalaxy.org.au
      GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
      NAME: ${{ matrix.name }}
      VERBOSE: ${{ inputs.verbose && '-v' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Planemo
        run: pip install -r requirements.txt

      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Download workflow from its source
        run: python scripts/workflows.py fetch "$NAME" run

      - name: Run Planemo test
        run: |
          mkdir -p reports
          set +e
          planemo $VERBOSE test \
            --engine external_galaxy \
            --galaxy_url "$GALAXY_URL" \
            --galaxy_user_key "$GALAXY_API_KEY" \
            --history_name "github-test: $NAME (run ${{ github.run_number }})" \
            --test_timeout 10800 \
            --test_output_json "reports/$NAME.json" \
            --test_output_text "reports/$NAME.txt" \
            "run/$NAME.ga"
          echo "Planemo exit code $?. Pass or fail is decided in the next step, from the JSON report."

      - name: Check result
        run: python scripts/result.py "reports/$NAME.json" "run/$NAME.html.json"

      - name: Build HTML report
        if: always()
        run: planemo test_reports "run/$NAME.html.json" --test_output "reports/$NAME.html" || echo "HTML report not built."

      - name: Show result
        if: always()
        run: |
          cp "run/$NAME.source.json" reports/ 2>/dev/null || true
          cat "reports/$NAME.txt" 2>/dev/null || echo "No text report."
          {
            echo "### $NAME"
            python -c "import json; s=json.load(open('run/$NAME.source.json')); print(f\"Tested {s['source']} {s['id']} version {s['version']} ({s['url']})\")" 2>/dev/null || echo "Workflow download failed."
            echo
            cat "reports/$NAME.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare tool versions
        if: always()
        run: |
          mkdir -p reports
          python scripts/versions.py "run/$NAME.ga" "reports/$NAME.json" | tee "reports/$NAME.versions.md"
          { echo; cat "reports/$NAME.versions.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check reports do not contain the API key
        id: scan
        if: always()
        run: |
          if [ -d reports ] && grep -rqF "$GALAXY_API_KEY" reports/; then
            echo "API key found in a report. The reports are not uploaded."
            exit 1
          fi

      - name: Upload reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up the test account
        if: always()
        run: python scripts/cleanup.py "reports/$NAME.json" "$RUN_STARTED_AT"
